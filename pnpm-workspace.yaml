packages:
  - apps/*
  - packages/*

catalog:
  next: ^16.2.0
  eslint-config-next: ^16.2.0
  '@next/eslint-plugin-next': ^16.2.0
  '@next/env': ^16.2.0
  react: ^19.2.3
  react-dom: ^19.2.3
  '@types/react': ^19.2.13
  '@types/react-dom': ^19.2.3
  typescript: ^6.0.0
  eslint: ^9.37.0
  '@types/node': ^24.10.4
  babel-plugin-react-compiler: ^1.0.0
  '@vitejs/plugin-react': ^5.1.0
  vite-tsconfig-paths: ^5.1.4
  vitest: ^4.0.8

  # It's crucial that all atproto and atcute packages are major version bumped in unison
  # to prevent compatibility issues between packages.

  '@atcute/identity': ^1.1.3
  '@atcute/identity-resolver': ^1.2.0

  '@atproto/repo': ^0.8.12
  '@atproto/syntax': ^0.4.2
  '@atproto/identity': ^0.4.10
  '@atproto/did': ^0.2.3
  '@atproto/api': ^0.18.8
  '@atproto/lexicon': ^0.6.0
  '@atproto/xrpc': ^0.7.7

onlyBuiltDependencies:
  - '@vercel/speed-insights'
  - bufferutil
  - cbor-extract
  - esbuild
  - sharp
  - unrs-resolver
  - utf-8-validate

# fly.toml app configuration file generated for frontpage-search on 2026-03-26T12:29:26Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'frontpage-search'
primary_region = 'lhr'

[build]

[http_service]
internal_port = 7700
force_https = true
auto_stop_machines = 'stop'
auto_start_machines = true
min_machines_running = 0
processes = ['app']

[[vm]]
memory = '1gb'
cpu_kind = 'shared'
cpus = 1
memory_mb = 1024

[mounts]
source = "search_data"
destination = "/meili_data"

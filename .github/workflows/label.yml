name: label
on: pull_request_target

jobs:
  labeller:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483 # v6.0.1
        with:
          fetch-depth: 2
      - uses: actions/labeler@v5
        with:
          sync-labels: true

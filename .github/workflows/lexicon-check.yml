name: Lex Check
permissions:
  contents: read

on:
  pull_request:
    paths:
      - "lexicons/fyi/**/*"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: "stable"
          cache: true

      - name: Cache glot binary
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        id: cache-glot
        with:
          path: ~/go/bin/glot
          key: ${{ runner.os }}-glot-671143193b640e1d1224b311f62acc54dd33b241
          restore-keys: |
            ${{ runner.os }}-glot-

      - name: Install glot
        if: steps.cache-glot.outputs.cache-hit != 'true'
        run: go install tangled.org/bnewbold.net/cobalt/cmd/glot@671143193b640e1d1224b311f62acc54dd33b241

      - name: Run lexicon lint
        run: glot lint lexicons/fyi/frontpage

  compat-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: "stable"
          cache: true

      - name: Cache glot binary
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        id: cache-glot
        with:
          path: ~/go/bin/glot
          key: ${{ runner.os }}-glot-671143193b640e1d1224b311f62acc54dd33b241
          restore-keys: |
            ${{ runner.os }}-glot-

      - name: Install glot
        if: steps.cache-glot.outputs.cache-hit != 'true'
        run: go install tangled.org/bnewbold.net/cobalt/cmd/glot@671143193b640e1d1224b311f62acc54dd33b241

      - name: Run lexicon compatibility check
        run: glot compat lexicons/fyi/frontpage
